name: Deploy to GitHub Pages

on:
  # Publish on every push to the default branch.
  push:
    branches: [main]
  # Build (but do not deploy) on PRs so diagram/link errors are caught before merge.
  pull_request:
    branches: [main]

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        # `docusaurus build` fails on broken links and invalid Mermaid/MDX,
        # so a green build is also a content-validation gate.
        run: npm run build
      - name: Upload Pages artifact
        # Only the production branch needs the artifact for deployment.
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    # Only deploy on push to main, never on PRs.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
